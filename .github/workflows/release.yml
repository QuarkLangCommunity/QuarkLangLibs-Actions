name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 打包 .qk 与文档
        run: |
          mkdir -p dist
          zip -r "dist/QuarkLangLibs-Actions-${GITHUB_REF_QuarkLangLibs-Actions}.zip" . -x '.git/*' -x 'dist/*'
      - uses: actions/upload-artifact@v4
        with:
          name: QuarkLangLibs-Actions-package
          path: dist/*
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/*
