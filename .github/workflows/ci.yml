name: ci
on: [push, pull_request]

# 最小权限：CI 只读（显式声明，不依赖仓库默认值）
permissions:
  contents: read


jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4（SHA 固定；dependabot 周更）
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5（SHA 固定；dependabot 周更）
        with:
          go-version: '1.26'
      - name: 取解释器与工具链
        run: |
          # 钉主仓**版本 tag**（不再跟 main）：主仓变更不再连坐本仓 CI；升级时同步改这里
          git clone --depth 1 --branch v2.0.0 https://github.com/QuarkLangCommunity/QuarkLangQkc.git /tmp/qkc-repo
          cd /tmp/qkc-repo && go build -o /tmp/quark main.go
          git clone --depth 1 https://github.com/QuarkLangCommunity/QuarkLangQkfmt.git /tmp/qkfmt-repo
          cd /tmp/qkfmt-repo && go build -o /tmp/qkfmt .
      - name: 库测试
        run: |
          if [ -x tests/run.sh ]; then QUARK=/tmp/quark ./tests/run.sh; fi
      - name: 格式检查（提示，不阻断）
        run: |
          /tmp/qkfmt -l $(git ls-files '*.qk' | head -50) || true
